name: Generate 3D contribution graph

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: profile-3d-contrib
    steps:
      - uses: actions/checkout@v4

      - uses: github-profile-3d-contrib/github-profile-3d-contrib@v1.4.0
        with:
          username: Onkarnagargoje
          user: Onkarnagargoje
          path: profile-3d-contrib.svg

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update 3D contribution graph"
          file_pattern: profile-3d-contrib.svg
