name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: Onkarnagargoje
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark&color_snake=22d3ee

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_dir: dist
          branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
