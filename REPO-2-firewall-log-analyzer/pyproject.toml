[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "firewall-log-analyzer"
version = "0.1.0"
description = "CLI firewall log triage tool for SOC learning and portfolios"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Onkar Nagargoje", email = "onkarnagargoje25@gmail.com" }]
dependencies = []

[project.scripts]
firewall-analyzer = "firewall_log_analyzer.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
